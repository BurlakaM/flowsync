# Production overlay for a VPS: ready-made images from the registry instead of local builds,
# and Caddy in front (automatic HTTPS). Nothing but Caddy listens on the public network.
#
#   COMPOSE_FILES="-f docker-compose.yml -f docker-compose.vps.yml" ./ops/deploy.sh <tag>
#
# Needs in the root .env: DOCKER_USERNAME, DOMAIN (e.g. flowsync.example.com), ACME_EMAIL.
services:
  backend:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME in .env}/flowsync-back:${TAG:-latest}
    pull_policy: always

  frontend:
    image: ${DOCKER_USERNAME:?Set DOCKER_USERNAME in .env}/flowsync-front:${TAG:-latest}
    pull_policy: always
    # Caddy reaches it over the internal network; the published :8080 of the base file is dropped.
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    container_name: flowsync-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN in .env}
      ACME_EMAIL: ${ACME_EMAIL:?Set ACME_EMAIL in .env}
    volumes:
      - ./ops/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here: losing the volume means re-issuing them (Let's Encrypt rate limits apply).
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_healthy
    networks:
      - app_network

volumes:
  caddy_data:
  caddy_config:
