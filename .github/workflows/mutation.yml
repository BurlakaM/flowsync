name: Mutation tests

# Stryker changes the security- and data-critical services and checks that the unit tests notice. It takes
# several minutes, so it runs weekly and on demand instead of on every pull request.
on:
  workflow_dispatch:
  schedule:
    - cron: "37 3 * * 0"

permissions:
  contents: read

jobs:
  stryker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # The schema is needed to type-check the code the tests import; no database is used.
      - run: DATABASE_URL=postgresql://ci:ci@localhost:5432/ci npx prisma generate
      # Fails when the mutation score drops below `thresholds.break` in stryker.config.mjs.
      - run: npm run test:mutation
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mutation-report
          path: backend/reports/mutation/
          retention-days: 30
