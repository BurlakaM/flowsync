name: CodeQL

# Static analysis of the TypeScript code (injection, unsafe regular expressions, tainted data...).
# Results appear under Security > Code scanning of the repository.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # New queries and new vulnerabilities appear without any commit: scan weekly too.
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: "/language:javascript-typescript"
