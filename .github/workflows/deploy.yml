name: Deploy

# Publishes Docker images only after CI has succeeded for a push to main.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flowsync-back:${{ github.event.workflow_run.head_sha }}
            ${{ secrets.DOCKER_USERNAME }}/flowsync-back:latest
          cache-from: type=gha,scope=backend
      - name: Publish frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: prod
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/flowsync-front:${{ github.event.workflow_run.head_sha }}
            ${{ secrets.DOCKER_USERNAME }}/flowsync-front:latest
          cache-from: type=gha,scope=frontend
