name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: flowsync
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d flowsync"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Real-time e2e test across two API instances (the Socket.IO Redis adapter).
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowsync
      # The e2e tests wipe this database; it is disposable in CI.
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/flowsync
      TEST_REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npx prisma validate
      - run: npx prisma generate
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      # Unit tests with the coverage threshold for the services (see vitest.config.ts).
      - run: npm run test:cov
      # Global setup of the e2e tests applies the committed migrations to TEST_DATABASE_URL.
      - run: npm run test:e2e
      # Fails (exit code 2) when schema.prisma was changed without creating a migration.
      - run: npx prisma migrate diff --from-config-datasource --to-schema prisma/schema.prisma --exit-code
      - run: npm run build
      # Fails when the API changed but backend/openapi.json was not regenerated (npm run openapi:export).
      - run: npm run openapi:export
      - run: git diff --exit-code -- openapi.json

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      # Fails when backend/openapi.json changed but the generated types were not refreshed (npm run api:types).
      - run: npm run api:types
      - run: git diff --exit-code -- src/types/api.generated.ts
      - run: npm run typecheck
      - run: npm test
      # `npm run build` type-checks again and produces the same bundle as the Docker image.
      - run: npm run build

  # What npm audit cannot see: the images themselves (base OS, the npm that ships with Node, nginx) and the
  # whole git history. The same script runs locally: ./ops/security-scan.sh all
  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Secrets are searched in the whole history, not only in the latest commit.
          fetch-depth: 0
      - name: Secrets in the git history (gitleaks)
        run: bash ops/security-scan.sh secrets
      - name: Vulnerabilities in the production images (Trivy)
        run: bash ops/security-scan.sh images
      - name: Software bill of materials (CycloneDX)
        run: bash ops/security-scan.sh sbom
      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom/
          retention-days: 90

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # The production-like stack (nginx + API + database) with throw-away secrets that exist only on this runner.
      - name: Create throw-away environment files
        run: |
          echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)" > .env
          echo "JWT_SECRET=$(openssl rand -hex 32)" > backend/.env
      - name: Start the stack
        run: docker compose -f docker-compose.yml up -d --build --wait
      - name: Install dependencies and the browser
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Run the end-to-end tests
        working-directory: frontend
        run: npm run test:e2e
        env:
          E2E_BASE_URL: http://localhost:8080
      - name: Keep the report of a failed run
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7
      - name: Show the container logs of a failed run
        if: failure()
        run: docker compose -f docker-compose.yml logs --tail 100

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build backend image
        uses: docker/build-push-action@v7
        with:
          context: ./backend
          target: prod
          push: false
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend
      - name: Build frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          target: prod
          push: false
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
