# Scrapes the API inside the Docker network (nginx never forwards /api/metrics to the internet).
global:
  scrape_interval: 10s
  evaluation_interval: 10s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flowsync-api
    metrics_path: /api/metrics
    static_configs:
      - targets: ["backend:3000"]
