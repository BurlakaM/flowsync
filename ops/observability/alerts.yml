# Alerts derived from the SLOs in docs/SLO.md. In dev they only show up on http://localhost:9090/alerts;
# in production wire Prometheus to Alertmanager (or Grafana alerting) to be notified.
groups:
  - name: flowsync-slo
    rules:
      - alert: ApiDown
        expr: up{job="flowsync-api"} == 0
        for: 1m
        labels: { severity: page }
        annotations:
          summary: The API does not answer scrapes for 1 minute

      - alert: HighErrorRatio
        # SLO: 99.5% of requests are not 5xx. 2% of errors burns a 30-day budget in about a day and a half.
        expr: |
          sum(rate(http_request_duration_seconds_count{status_code=~"5.."}[5m]))
            / sum(rate(http_request_duration_seconds_count[5m])) > 0.02
        for: 5m
        labels: { severity: page }
        annotations:
          summary: More than 2% of requests fail with 5xx (5 min window)

      - alert: SlowRequests
        # SLO: p95 of API latency under 300 ms.
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.3
        for: 10m
        labels: { severity: ticket }
        annotations:
          summary: p95 request latency has been above 300 ms for 10 minutes

      - alert: MailJobsFailing
        expr: flowsync_mail_queue_jobs{state="failed"} > 0
        for: 15m
        labels: { severity: ticket }
        annotations:
          summary: Mail jobs have been failing for 15 minutes, the mail server is probably down

      - alert: EventLoopLagging
        expr: nodejs_eventloop_lag_p99_seconds > 0.2
        for: 5m
        labels: { severity: ticket }
        annotations:
          summary: The Node event loop is blocked for more than 200 ms (p99)
