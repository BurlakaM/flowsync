# Development mode, applied automatically by `docker compose up`:
# hot reload, source bind-mounts and the ports needed to work from the host.
services:
  backend:
    build:
      target: dev
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      # The API is called directly in development: there is no proxy to trust.
      TRUST_PROXY: "0"
      # Bind mounts from Windows do not deliver file-system events, so tsc --watch must poll.
      TSC_WATCHFILE: PriorityPollingInterval
      TSC_WATCHDIRECTORY: RecursiveDirectoryUsingDynamicPriorityPolling
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start:dev"
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - ./backend/test:/app/test

  frontend:
    build:
      target: dev
    ports: !override
      - "3001:3000"
    environment:
      REACT_APP_API_URL: http://localhost:3000/api
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      WDS_SOCKET_PORT: "3001"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  db:
    ports:
      - "5433:5432"

  # Disposable database for the e2e tests (data lives in memory):
  #   docker compose --profile test up -d db_test
  db_test:
    image: postgres:16-alpine
    profiles: ["test"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: flowsync_test
    tmpfs:
      - /var/lib/postgresql/data
    ports:
      - "5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20
