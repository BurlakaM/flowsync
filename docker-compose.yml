services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nest_api_prod
    ports:
      - "3000:3000"
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/jira
    command: sh -c "npx prisma db push && npx prisma db seed && node dist/main"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: react_frontend_prod
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - app_network

  db:
    image: postgres:16-alpine
    container_name: postgres_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: jira
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jira"]
      interval: 5s
      timeout: 5s
      retries: 20
    ports:
      - "5433:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    networks:
      - app_network

networks:
  app_network:
    driver: bridge

volumes:
  pg_data:
